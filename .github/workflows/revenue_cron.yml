name: Handasa Revenue Engine Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python -m pip install bandit==1.7.10 ruff==0.8.4
      - run: ruff check .
      - run: bandit -r . -x ./.git

  run-engine:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only analytics
        env:
          NETWORK_RPC_URL: ${{ secrets.NETWORK_RPC_URL }}
          NETWORK_RPC_URLS: ${{ secrets.NETWORK_RPC_URLS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OBSERVED_VOLUME_USD: ${{ vars.OBSERVED_VOLUME_USD }}
          FEE_PERCENTAGE: ${{ vars.FEE_PERCENTAGE }}
        run: python revenue_engine.py
      - name: Observe incoming USDT deposits (read-only)
        env:
          NETWORK_RPC_URL: ${{ secrets.NETWORK_RPC_URL }}
          NETWORK_RPC_URLS: ${{ secrets.NETWORK_RPC_URLS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPOSIT_WALLET_ADDRESS: ${{ vars.DEPOSIT_WALLET_ADDRESS }}
          USDT_CONTRACT_ADDRESS: ${{ vars.USDT_CONTRACT_ADDRESS }}
          USDT_DECIMALS: ${{ vars.USDT_DECIMALS }}
          SCAN_BLOCKS: ${{ vars.SCAN_BLOCKS }}
          EXPLORER_TX_URL: ${{ vars.EXPLORER_TX_URL }}
          DEPOSIT_STATE_FILE: data/deposits.jsonl
          DEPOSIT_SEEN_FILE: data/seen_deposits.txt
        run: python deposit_monitor.py
      - name: Upload observed deposit records
        uses: actions/upload-artifact@v4
        with:
          name: observed-deposits-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
